<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#090708" />
  <meta name="description" content="The Sith Order doctrine archive." />
  <title>TSO — Sith Doctrine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23090708' d='M0 0h64v64H0z'/%3E%3Cpath fill='none' stroke='%23d43b48' stroke-width='4' d='M32 7 56 51H8L32 7Zm0 14 11 21H21l11-21Z'/%3E%3C/svg%3E" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" data-link aria-label="Sith Doctrine home">
      <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6 58 52H6L32 6Z"/><path d="m32 20 13 24H19l13-24Z"/><circle cx="32" cy="43" r="3"/></svg>
      <span><strong>TSO</strong><small>Sith Doctrine</small></span>
    </a>
    <button class="menu-toggle" id="menuToggle" aria-label="Open navigation">Menu</button>
    <nav class="main-nav" id="mainNav" aria-label="Primary navigation">
      <a href="/" data-link>Archive</a>
      <div class="sections-menu">
        <button id="sectionsButton" aria-expanded="false">Sections <span>⌄</span></button>
        <div class="sections-popover" id="sectionsPopover"></div>
      </div>
      <button class="search-trigger" id="searchTrigger" aria-label="Search all doctrine">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <span>Search</span><kbd>/</kbd>
      </button>
    </nav>
  </header>

  <div class="search-panel" id="searchPanel" hidden>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="globalSearch" type="search" placeholder="Search every doctrine record…" autocomplete="off" />
      <button id="closeSearch" aria-label="Close search">×</button>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>

  <main id="app" tabindex="-1">
    <div class="loading-page"><span class="loader-sigil"></span><p>Opening the archive</p></div>
  </main>

  <footer>
    <span>TSO · Sith Doctrine Archive</span>
    <span id="syncStatus">Connecting to Trello</span>
  </footer>

  <script src="/app.js" defer></script>
</body>
</html>
